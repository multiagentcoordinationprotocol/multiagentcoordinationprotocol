name: Publish Proto Packages

on:
  push:
    tags:
      - 'proto-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — build and verify only, skip publishing'
        required: true
        type: boolean
        default: true
      npmjs_only:
        description: 'Publish only @multiagentcoordinationprotocol/proto to npmjs (backfill an existing version)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            VERSION="${GITHUB_REF#refs/tags/proto-v}"
            DRY_RUN="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (dry_run: $DRY_RUN)"

  # ── npm (@multiagentcoordinationprotocol/proto) ──────────────────────
  publish-npm:
    name: Publish npm Package (@multiagentcoordinationprotocol/proto)
    runs-on: ubuntu-latest
    needs: [extract-version]
    permissions:
      contents: read
      packages: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@multiagentcoordinationprotocol'

      - name: Prepare package
        run: |
          cd packages/proto-npm
          rm -rf proto/macp
          cp -r ../../schemas/proto/macp proto/macp
          VERSION="${{ needs.extract-version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Verify package
        run: cd packages/proto-npm && npm pack --dry-run

      - name: Publish to GitHub Packages
        if: needs.extract-version.outputs.dry_run != 'true' && inputs.npmjs_only != true
        run: cd packages/proto-npm && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macp-sdk-typescript is published to npmjs and depends on this package, so it must be on npmjs
      # too, or `npm install macp-sdk-typescript` fails with E404 for anyone without a GitHub Packages
      # .npmrc. GitHub Packages stays for existing consumers.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@multiagentcoordinationprotocol'

      - name: Publish to npmjs
        if: needs.extract-version.outputs.dry_run != 'true'
        run: cd packages/proto-npm && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── PyPI (macp-proto) ───────────────────────────────────────────────
  publish-pypi:
    name: Publish PyPI Package (macp-proto)
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        # grpcio-tools is PINNED: the generator version determines the gencode's
        # real protobuf/grpcio runtime floors, which must equal the floors
        # declared in packages/proto-python/pyproject.toml. Bump both together.
        run: pip install build twine grpcio-tools==1.82.1

      - name: Generate Python protobuf code
        run: |
          cd packages/proto-python
          python -m grpc_tools.protoc \
            -I../../schemas/proto \
            --python_out=src \
            --grpc_python_out=src \
            macp/v1/envelope.proto macp/v1/core.proto macp/v1/policy.proto \
            macp/modes/decision/v1/decision.proto macp/modes/proposal/v1/proposal.proto \
            macp/modes/task/v1/task.proto macp/modes/handoff/v1/handoff.proto \
            macp/modes/quorum/v1/quorum.proto macp/modes/multi_round/v1/multi_round.proto

      - name: Update version and build
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          cd packages/proto-python
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          python -m build

      - name: Publish to PyPI
        if: needs.extract-version.outputs.dry_run != 'true'
        run: cd packages/proto-python && twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── Rust crate (macp-proto) ─────────────────────────────────────────
  publish-rust:
    name: Publish Rust Crate (macp-proto)
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7

      - name: Prepare crate
        run: |
          cd packages/proto-rust
          rm -rf proto/macp
          cp -r ../../schemas/proto/macp proto/macp
          VERSION="${{ needs.extract-version.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml

      - name: Verify crate builds
        run: cd packages/proto-rust && cargo check

      - name: Publish to crates.io
        if: needs.extract-version.outputs.dry_run != 'true'
        run: cd packages/proto-rust && cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Go ───────────────────────────────────────────────────────────────
  # No Go job. Go users install the packages the Buf Schema Registry generates
  # from every push to main (ci.yml's buf-push step): see packages/proto-go/README.md
  # and issue #206. ci.yml still generates and builds Go as a compile check.

  # ── Java (Maven / GitHub Packages) ──────────────────────────────────
  publish-java:
    name: Publish Java Package (io.macp:macp-proto)
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Generate Java code
        run: buf generate --template buf/buf.gen.java.yaml

      - name: Build and verify
        run: |
          cd packages/proto-java
          VERSION="${{ needs.extract-version.outputs.version }}"
          sed -i "s/version = .*/version = \"${VERSION}\"/" build.gradle.kts
          gradle compileJava

      - name: Publish to GitHub Packages
        if: needs.extract-version.outputs.dry_run != 'true'
        run: cd packages/proto-java && gradle publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Kotlin (Maven / GitHub Packages) ────────────────────────────────
  publish-kotlin:
    name: Publish Kotlin Package (io.macp:macp-proto-kotlin)
    runs-on: ubuntu-latest
    needs: [extract-version, publish-java]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Generate Kotlin code
        run: buf generate --template buf/buf.gen.kotlin.yaml

      - name: Install Java dependency to mavenLocal (dry run)
        if: needs.extract-version.outputs.dry_run == 'true'
        run: |
          buf generate --template buf/buf.gen.java.yaml
          cd packages/proto-java
          VERSION="${{ needs.extract-version.outputs.version }}"
          sed -i "s/version = .*/version = \"${VERSION}\"/" build.gradle.kts
          gradle publishToMavenLocal

      - name: Build and verify
        run: |
          cd packages/proto-kotlin
          VERSION="${{ needs.extract-version.outputs.version }}"
          sed -i "s/version = .*/version = \"${VERSION}\"/" build.gradle.kts
          sed -i "s/io.macp:macp-proto:[0-9.]*\"/io.macp:macp-proto:${VERSION}\"/" build.gradle.kts
          gradle compileKotlin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: needs.extract-version.outputs.dry_run != 'true'
        run: cd packages/proto-kotlin && gradle publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── C# (NuGet / GitHub Packages) ────────────────────────────────────
  publish-csharp:
    name: Publish C# Package (Macp.Proto)
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Generate C# code
        run: buf generate --template buf/buf.gen.csharp.yaml

      - name: Build and verify
        run: |
          cd packages/proto-csharp
          VERSION="${{ needs.extract-version.outputs.version }}"
          dotnet pack -c Release -p:Version="$VERSION" -o nupkg/

      - name: Publish to GitHub Packages
        if: needs.extract-version.outputs.dry_run != 'true'
        run: |
          cd packages/proto-csharp
          dotnet nuget push nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/multiagentcoordinationprotocol/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}"

  # ── Conformance bundle (GitHub release asset) ───────────────────────
  # One reproducible tarball of the conformance fixtures, commitment-hash
  # vectors, parity contract and rule schemas, plus SHA256SUMS, so embedders
  # pin one file and one checksum. The previous release's MANIFEST.json gates
  # path stability (schemas/conformance-bundle.json `moved`).
  conformance-bundle:
    name: Attach conformance bundle to the release
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: inputs.npmjs_only != true
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the previous bundle manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(gh release list --limit 50 --json tagName -q '.[].tagName' \
            | grep '^proto-v' | grep -vx "proto-v$VERSION" | while read -r tag; do
                if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx MANIFEST.json; then
                  echo "$tag"; break
                fi
              done || true)
          if [ -n "$prev" ]; then
            gh release download "$prev" --pattern MANIFEST.json --dir prev
            echo "PREV_MANIFEST=prev/MANIFEST.json" >> "$GITHUB_ENV"
            echo "Path-stability baseline: $prev"
          else
            echo "No earlier bundle; skipping the path-stability baseline."
          fi

      - name: Build bundle
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          python3 scripts/build-conformance-bundle.py --version "$VERSION" --out dist \
            ${PREV_MANIFEST:+--previous-manifest "$PREV_MANIFEST"}
          cat dist/SHA256SUMS

      - name: Upload to the release
        if: needs.extract-version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: proto-v${{ needs.extract-version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Proto packages and conformance bundle for $TAG."
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/MANIFEST.json --clobber

  # ── Notify in-org proto consumers (event-driven bump) ───────────────
  # After the ecosystems this org consumes have published, dispatch
  # proto-released {version, ecosystem} to each of the 4 in-org consumers.
  # Their bump-proto.yml (macp-ci@v1 → bump-consume.yml) opens a bump PR and
  # arms auto-merge. Uses a short-lived macp-deps-bot App token — no PATs.
  dispatch-consumers:
    name: Dispatch proto-released to consumers
    runs-on: ubuntu-latest
    needs: [extract-version, publish-npm, publish-pypi, publish-rust]
    if: needs.extract-version.outputs.dry_run != 'true' && inputs.npmjs_only != true
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MACP_BOT_APP_ID }}
          private-key: ${{ secrets.MACP_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            macp-runtime
            macp-sdk-python
            macp-sdk-typescript
            macp-control-plane

      - name: Dispatch proto-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          set -euo pipefail
          dispatch() {  # $1=repo  $2=ecosystem
            jq -nc --arg v "$VERSION" --arg e "$2" \
              '{event_type:"proto-released",client_payload:{version:$v,ecosystem:$e}}' \
              | gh api -X POST "repos/$OWNER/$1/dispatches" --input -
            echo "dispatched proto-released {version=$VERSION, ecosystem=$2} -> $1"
          }
          dispatch macp-runtime        cargo
          dispatch macp-sdk-python     pip
          dispatch macp-sdk-typescript npm
          dispatch macp-control-plane  npm

