syntax = "proto3";

package macp.modes.multi_round.v1;

// Contribution submitted by a participant during a round of the
// ext.multi_round.v1 iterative-convergence mode.
//
// A participant MAY contribute more than once; a contribution whose value
// differs from the sender's previous contribution advances the round.
// Convergence semantics (e.g. all_equal) are evaluated by the runtime's
// mode implementation over the latest contribution per participant.
//
// `value` is an opaque string by design: contributions are compared for
// equality only, never interpreted. Structured or binary contributions can
// be added as new fields in a later revision without breaking this one.
//
// `value` is declared without `optional`, so it has no proto3 field presence:
// an explicitly-empty contribution encodes to zero bytes, byte-identical to an
// absent payload -- a distinction the legacy JSON form (`{"value": ""}`) could
// express and this one cannot. macp-runtime's parse_contribute_value rejects a
// zero-byte Contribute outright, citing this among its reasons. Restoring
// presence via `optional` would be a breaking change to an already-shipped
// public field, not a patch.
//
// Decoding (normative; this mode has no RFC, so this comment is its home).
// Canonical encoding: protobuf. A sender MUST encode ContributePayload as
// canonical protobuf. A receiver MAY also accept the legacy JSON form
// `{"value": "<string>"}`. A receiver that does MUST use decode order: JSON,
// then protobuf -- it attempts JSON first, trusts a successful JSON parse only
// when the same bytes do NOT also round-trip byte-identically through the
// canonical protobuf encoding, and otherwise decodes the bytes as protobuf.
// The tie-break exists because some canonical encodings are also valid JSON:
// at value byte-lengths such as 10, 13, 32 and 123 the tag and length bytes
// read as JSON whitespace or `{`. A session a runtime recorded before it
// applied the tie-break replays under the decode in force when it was
// recorded (RFC-MACP-0003).
//
// Empty payload: a runtime acting as this mode's acceptance gate MUST reject
// a zero-byte Contribute. A decoder that is not an acceptance gate, such as an
// SDK reading history, MAY return its "nothing decodable" result instead.
message ContributePayload {
  // The contribution, compared for equality only and never interpreted.
  string value = 1;
}

// Multi-Round Mode reuses macp.v1.CommitmentPayload for terminal results.
// The resolution summary and per-round internal state are runtime-internal
// representations, not wire payloads, and are deliberately not specified
// here.
